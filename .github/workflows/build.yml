name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: liberica
          java-version: '27'
          cache: maven

      - name: Build jar (skip tests)
        run: mvn -B -ntp -DskipTests clean package

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: app-jar
          path: target/app.jar
          if-no-files-found: error
          retention-days: 7

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          # Always re-resolve the base image so channel tags like
          # java:27-ubuntu26.10 pick up the latest runtime build.
          pull: true
          # Push on push-to-main and manual runs from main, but never on PRs.
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
